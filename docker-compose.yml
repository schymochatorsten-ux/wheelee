# wheelee auf dem NAS (nfnas).
#
# Erreichbar ausschließlich über den Tailscale-Tunnel: Der Port wird an
# 100.71.71.105 gebunden, nicht an 0.0.0.0. Damit ist die App weder aus dem
# Heimnetz noch aus dem Internet direkt zu erreichen – den Weg nach außen
# öffnet allein der Nginx Proxy Manager auf dem VPS.
#
#   Gegenprobe, die fehlschlagen MUSS:
#     curl http://192.168.178.158:3015
#
# Kein `networks:`-Block: Das NPM-Netz existiert nur auf dem VPS. Forward-Ziel
# im NPM ist deshalb 100.71.71.105:3015, nie ein Containername.

services:
  wheelee:
    build:
      context: .
      dockerfile: Dockerfile
    image: wheelee:local
    container_name: wheelee
    restart: unless-stopped
    ports:
      - "100.71.71.105:3015:3000"
    environment:
      - NODE_ENV=production
      - TZ=Europe/Berlin
    # ADMIN_EMAILS gehört **nicht** hierher, sondern in `/opt/wheelee/.env`:
    # Diese Datei liegt im Repository, und eine E-Mail-Adresse darin wäre
    # öffentlich – genau der Mangel, der den `mailto:`-Weg in Abschnitt 17
    # erledigt hat. Ohne die Datei startet die App trotzdem; dann hat nur
    # niemand Zugriff auf die Rückmeldungen (siehe `deploy/env.beispiel`).
    env_file:
      - path: .env
        required: false
    volumes:
      # Konten und Rückmeldungen (SQLite). **Ein benanntes Volume und kein
      # Bind-Mount** – so sieht es das Backup-Schema des NAS vor.
      #
      # Das ist die Stelle, an der ein Deploy nicht mehr folgenlos ist: Vorher
      # war jeder Neubau ein vollständiger Ersatz, der nichts verlieren
      # konnte, weil die App nur gelesen hat. Jetzt gibt es Daten, die den
      # Neubau überleben müssen.
      - wheelee-data:/app/var
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wheelee-data:
